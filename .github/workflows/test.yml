name: CI

on:
  push:
    branches: [main, v4]
  pull_request:
    branches: [main, v4]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run tests (node${{ matrix.node }})
    strategy:
      matrix: { node: [24] }
    steps:
      - &checkout
        uses: actions/checkout@v7
      - &setup-pnpm
        uses: pnpm/action-setup@v6
        with: { version: 12 }
      - &setup-node
        uses: actions/setup-node@v7
        with:
          cache: "pnpm"
          node-version: ${{ matrix.node }}
      - run: pnpm ci
      - run: pnpm test
